<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body{
            background-image: url(../fondov.jpg);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            justify-content: center;
            color: white;
        }
        section{
           color: white;
            align-items: center;
            display: flex;
            flex-direction: column;
            justify-content: center;            
            justify-items: center;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(3px); 
        }
        header{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: rgb(6, 113, 235);            
            background-color: black;
        }
    </style>

</head>
<body>
    <main>
        <header class="portafolio-header">
            <h1>Bienvenido a nuestra Agencia</h1>
            <h2>Julian D Salazar A / Tu Guia de Confianza</h2>
            <nav id="menu">                
                    <div><a href="../index.html">Pagina de Inicio</a></div>
                    <div><a href="./viajes.html">Viajes</a></div>
                    <div><a href="reservas.html">Reservas</a></div>  
            </nav>           
        
        </header>
        <section>
            <h2>Formulario de Viajes</h2>
            <form id="formulario" method="post" >
                <fieldset>

                    <legend>Tus Datos</legend> 

                    <div class="campo">
                        <label for="nombre">Nombre Completo</label>
                        <input type="text" id="nombre" name="nombre" required>
                    </div>
                    <div class="campo">
                        <label for="cedula">Documento de Identidad</label>
                        <input type="number" id="cedula" name="cedula" required>
                    </div>
                    <div class="campo">
                        <label for="correo">Correo Electronico</label>
                        <input 
                            type="email" 
                            id="correo" 
                            name="correo" 
                            required
                            placeholder="example@email.com"
                            >
                    </div>
                    <div class="campo">
                        <label for="contacto">Numero de Contacto</label>
                        <input type="tel" id="contacto" name="contacto" required>
                    </div>

                </fieldset>
                <fieldset>

                    <legend>Tu Viaje</legend>

                    <div class="campo">
                        <label for="fecha">Fecha de reserva</label>
                        <input type="date" id="fecha" name="fecha" required 
                        placeholder="DD/MM/AAAA">
                    </div>
                    
                    <div class="campo">
                        <p>Tipo de Plan de Viaje</p>

                        <input type="radio" id="individual" name="planv" value="individual">
                        <label for="individual">Plan individual</label>

                        <input type="radio" id="pareja" name="planv" value="pareja">
                        <label for="urbana">Plan en pareja</label>

                        <input type="radio" id="tour" name="planv" value="tour">
                        <label for="tour">Gran tour</label>

                    </div>
                </fieldset>
                <FIEldset>
                    <legend>Confirmación</legend>

                    <div class="campo">
                        <label for="nota">Notas adicionales</label>
                        <textarea name="n-especiales" id="notas" rows="4" cols="30"></textarea>

                    </div>
                    <div class="campo">
                        <input type="checkbox" id="terminos" name="acepta_terminos" value="si" required>
                        <label for="terminos">Aceptas los términos y condiciones</label>
                    </div>

                </FIEldset>

                <button type="submit">Enviar reserva</button>
                
            </form>
        </section>




    </main>
</body>
</html>
